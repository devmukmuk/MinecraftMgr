# Drop-in for minecraft-autostart.service: stop realms cleanly at shutdown/reboot.
#
# Without it the oneshot unit is already "inactive" after boot, so systemd never
# runs a stop step and a reboot kills each realm's Java process instead of sending
# `stop` (anything since the last autosave is lost). RemainAfterExit keeps the unit
# active so ExecStop runs. Ordered After=velocity-proxy (via Before= in that unit),
# so at shutdown realms stop first, then Velocity.
#
# Install: /etc/systemd/system/minecraft-autostart.service.d/stop.conf
# (see docs/workflows/reboot-recovery.md).

[Service]
RemainAfterExit=yes
ExecStop=/srv/mc/.venv/bin/python -m minecraftmgr realm stop --all
TimeoutStopSec=180
