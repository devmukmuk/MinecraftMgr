[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraftmgr"
version = "0.1.0"
description = "Minecraft server lifecycle management and oscar deployment toolkit"
authors = [
{name = "Mike"}
]
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "pyyaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
